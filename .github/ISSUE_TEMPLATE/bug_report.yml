name: Bug report
description: Something in Atrium does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead. Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /admin/…
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Atrium version
      placeholder: 0.1.0 or the commit
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: PHP, Laravel, database, browser
      placeholder: PHP 8.4, Laravel 13.17, MySQL 8.4, Chrome 142
  - type: textarea
    id: logs
    attributes:
      label: Errors from storage/logs or the browser console
      render: text

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets in the git history (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan
        run: ./gitleaks git --redact --no-banner --verbose .

  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: composer audit
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (demo app)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (admin panel)
        working-directory: packages/admin
        run: npm audit --omit=dev --audit-level=high

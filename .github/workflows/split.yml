name: split

# Copies each package folder, with its history, to its own read-only
# repository, which is what Packagist reads: packages/<folder> →
# AlveBy/atrium-<folder> (packages/admin → AlveBy/atrium-admin, the package
# alveby/atrium). The list of packages is every folder in packages/ with a
# composer.json, so a new package needs no change here, only its repository.
# A push to main updates their main branch, a tag v1.2.3 tags them too.
#
# A package with a package.json (the admin) ships built assets that the
# monorepo does not keep: they are built here and added in one more commit on
# top of the split, so `composer require` needs no Node. On main that commit
# also has the package repository's previous head as a parent, so the push
# stays a fast-forward.
#
# Needs the SPLIT_TOKEN secret: a fine-grained token of AlveBy with
# "Contents: read and write" on the package repositories (best "All
# repositories", so new packages work at once). Without it the job only says
# so and passes. A package whose repository is missing or out of the token's
# reach gets a warning and is skipped. With PACKAGIST_TOKEN (the safe API token from
# packagist.org/profile, as username:token or alone with the
# PACKAGIST_USERNAME variable) it also asks Packagist to read the new code,
# so the packages do not wait for a GitHub hook.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: split
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: List packages
        id: list
        run: |
          folders=$(ls -d packages/*/composer.json | cut -d/ -f2 | jq -R . | jq -cs .)
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          echo "$folders"

  split:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJson(needs.packages.outputs.folders) }}
    env:
      REPOSITORY: atrium-${{ matrix.folder }}
      SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    steps:
      - name: No token
        if: env.SPLIT_TOKEN == ''
        run: echo "::notice::SPLIT_TOKEN is not set, packages/${{ matrix.folder }} is not copied to AlveBy/${REPOSITORY}."

      - uses: actions/checkout@v7
        if: env.SPLIT_TOKEN != ''
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: env.SPLIT_TOKEN != '' && hashFiles(format('packages/{0}/package.json', matrix.folder)) != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/${{ matrix.folder }}/package-lock.json

      - name: Build assets
        if: env.SPLIT_TOKEN != '' && hashFiles(format('packages/{0}/package.json', matrix.folder)) != ''
        run: |
          npm ci --prefix "packages/${{ matrix.folder }}"
          npm run build --prefix "packages/${{ matrix.folder }}"
          echo "built=1" >> "$GITHUB_ENV"

      - name: Split and push
        if: env.SPLIT_TOKEN != ''
        run: |
          token=$(printf %s "$SPLIT_TOKEN" | tr -d '[:space:]')
          remote="https://x-access-token:${token}@github.com/AlveBy/${REPOSITORY}.git"
          sha=$(git subtree split --prefix="packages/${{ matrix.folder }}")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            ref="refs/tags/$GITHUB_REF_NAME"
          else
            ref="refs/heads/main"
          fi
          if [ "${built:-}" = 1 ]; then
            parents="-p $sha"
            if [ "$GITHUB_REF_TYPE" != tag ] && git fetch --quiet "$remote" main 2>/dev/null; then
              parents="$parents -p $(git rev-parse FETCH_HEAD)"
            fi
            index="$RUNNER_TEMP/split-index"
            GIT_INDEX_FILE="$index" git read-tree "$sha"
            (cd "packages/${{ matrix.folder }}" && GIT_INDEX_FILE="$index" git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree=. add -f dist)
            tree=$(GIT_INDEX_FILE="$index" git write-tree)
            sha=$(git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit-tree "$tree" $parents -m "Build the assets of $(git rev-parse --short HEAD)")
          fi
          if ! git push "$remote" "$sha:$ref"; then
            echo "::warning::packages/${{ matrix.folder }} is not copied: AlveBy/${REPOSITORY} does not exist, or SPLIT_TOKEN has no write access to it."
            echo "skip=1" >> "$GITHUB_ENV"
          fi

      - name: Update Packagist
        if: env.SPLIT_TOKEN != '' && env.PACKAGIST_TOKEN != '' && env.skip != '1'
        run: |
          token=$(printf %s "$PACKAGIST_TOKEN" | tr -d '[:space:]')
          case "$token" in
            ?*:?*) ;;
            *) token="${{ vars.PACKAGIST_USERNAME }}:$token" ;;
          esac
          case "$token" in
            ?*:?*) ;;
            *) echo "::error::Set PACKAGIST_TOKEN to username:token, or the token alone and the PACKAGIST_USERNAME variable"; exit 1 ;;
          esac
          key="${token#*:}"
          echo "Packagist user ${token%%:*}, token of ${#key} characters"
          curl -sS --fail-with-body -X POST https://packagist.org/api/update-package \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${token}" \
            -d "{\"repository\":\"https://github.com/AlveBy/${REPOSITORY}\"}" \
            || echo "::warning::Packagist did not update packages/${{ matrix.folder }}. A new package is submitted once at https://packagist.org/packages/submit with https://github.com/AlveBy/${REPOSITORY}."

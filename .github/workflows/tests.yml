name: tests

# Every job runs bin/ci, the same command contributors run before a push
# (docs/testing.md), so a green bin/ci on your machine means a green CI.
#
# "ci" is the one check to require in branch protection or a merge queue: it
# passes only when every other job passed, and its name does not change when
# jobs are added.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: bin/ci lint static

  phpunit:
    name: PHPUnit · PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5
      # S3 for the backup destination and CDN upload tests.
      s3:
        image: adobe/s3mock
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: backups,media
        ports: ['9090:9090']

    env:
      # bin/ci creates a database per package on these servers.
      ATRIUM_CI_MYSQL_PORT: 3306
      ATRIUM_CI_PGSQL_PORT: 5432
      ATRIUM_TEST_S3_ENDPOINT: http://127.0.0.1:9090

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl, gd, exif, zip
          coverage: none

      # The backup module dumps and restores with the databases' own tools;
      # pg_dump must be at least as new as the server.
      - name: Database clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          # mysqldump comes with the runner's own MySQL: installing mysql-client
          # reconfigures that server, which fails while the service holds 3306.
          sudo apt-get install -yq sqlite3 postgresql-client-17
          mysqldump --version

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: bin/ci tests --db=${{ matrix.db }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: phpunit-logs-${{ matrix.php }}-${{ matrix.db }}
          path: build/ci/logs

  coverage:
    name: Coverage and mutation testing · ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each machine mutates about a quarter of the changed lines, and
        # measures the coverage of the packages it mutates and of a quarter
        # of the rest (bin/ci --shard).
        shard: ['1/4', '2/4', '3/4', '4/4']
    services:
      # S3 for the backup destination and CDN upload tests.
      s3:
        image: adobe/s3mock
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: backups,media
        ports: ['9090:9090']
    env:
      ATRIUM_TEST_S3_ENDPOINT: http://127.0.0.1:9090
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate compares with the commit before the push.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, gd, exif, zip
          # Xdebug, as on contributors' machines, so the baselines match.
          coverage: xdebug

      # The backup module dumps and restores with the databases' own tools;
      # pg_dump must be at least as new as the server.
      - name: Database clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q
          # mysqldump comes with the runner's own MySQL: installing mysql-client
          # reconfigures that server, which fails while the service holds 3306.
          sudo apt-get install -yq sqlite3 postgresql-client-17
          mysqldump --version

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate

      - name: Find what the push changed
        id: base
        env:
          PULL_REQUEST: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="${PULL_REQUEST:-${MERGE_GROUP:-$BEFORE}}"
          # A new branch has no commit before it.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1); fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      # A pull request and the merge queue measure the packages the change can
      # break; a push to main measures every package. Infection takes every
      # core: the machine runs nothing else.
      - run: bin/ci coverage mutation --base=${{ steps.base.outputs.sha }} --shard=${{ matrix.shard }} --jobs=$(nproc) $CHANGED
        env:
          CHANGED: ${{ github.event_name != 'push' && '--changed' || '' }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ strategy.job-index }}
          path: |
            build/ci/coverage
            build/ci/infection/*/infection.log
            build/ci/logs

  dusk:
    name: Dusk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, gd, exif, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build

      # The admin ships a prebuilt bundle. Rebuild it from source and fail if
      # the committed dist/ is stale, then publish it like `atrium:install` does.
      - name: Build admin assets
        working-directory: packages/admin
        run: |
          npm ci
          npm run build
          git diff --exit-code --stat -- dist || (echo "packages/admin/dist is stale: run npm run build in packages/admin and commit it." && exit 1)
      - run: php artisan vendor:publish --tag=atrium-assets --force

      - name: Prepare app
        run: |
          cp .env.dusk.example .env
          php artisan key:generate
          cp .env .env.dusk.local
          touch database/dusk.sqlite
          # The public disk is served through public/storage, as after `atrium:install`.
          php artisan storage:link

      - run: php artisan dusk:chrome-driver --detect

      # Serves the app and runs Dusk on free ports, as on a contributor's machine.
      - run: bin/ci dusk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dusk-screenshots
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            build/ci/logs

  ci:
    name: ci
    if: always()
    needs: [lint, phpunit, coverage, dusk]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | { echo '| Job | Result |'; echo '|---|---|'; cat; } >> "$GITHUB_STEP_SUMMARY"
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} · ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        db: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: atrium
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: atrium
        ports: ['5432:5432']
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, intl, gd, exif
          coverage: none

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pick database
        run: |
          case "${{ matrix.db }}" in
            mysql) echo "DB_CONNECTION=mysql" >> $GITHUB_ENV; echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV; echo "DB_PORT=3306" >> $GITHUB_ENV; echo "DB_DATABASE=atrium" >> $GITHUB_ENV; echo "DB_USERNAME=root" >> $GITHUB_ENV; echo "DB_PASSWORD=password" >> $GITHUB_ENV ;;
            pgsql) echo "DB_CONNECTION=pgsql" >> $GITHUB_ENV; echo "DB_HOST=127.0.0.1" >> $GITHUB_ENV; echo "DB_PORT=5432" >> $GITHUB_ENV; echo "DB_DATABASE=atrium" >> $GITHUB_ENV; echo "DB_USERNAME=postgres" >> $GITHUB_ENV; echo "DB_PASSWORD=password" >> $GITHUB_ENV ;;
          esac

      - run: cp .env.example .env && php artisan key:generate

      - run: vendor/bin/phpunit
        env:
          # phpunit.xml forces in-memory SQLite; these override it for the MySQL/PostgreSQL legs
          DB_CONNECTION: ${{ env.DB_CONNECTION || 'sqlite' }}
          DB_DATABASE: ${{ env.DB_DATABASE || ':memory:' }}

  dusk:
    name: Dusk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, gd, exif
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci && npm run build

      # The admin ships a prebuilt bundle. Rebuild it from source and fail if
      # the committed dist/ is stale, then publish it like `atrium:install` does.
      - name: Build admin assets
        working-directory: packages/admin
        run: |
          npm ci
          npm run build
          git diff --exit-code --stat -- dist || (echo "packages/admin/dist is stale: run npm run build in packages/admin and commit it." && exit 1)
      - run: php artisan vendor:publish --tag=atrium-assets --force

      - name: Prepare app
        run: |
          cp .env.dusk.example .env
          php artisan key:generate
          cp .env .env.dusk.local
          touch database/dusk.sqlite

      - run: php artisan dusk:chrome-driver --detect

      - name: Serve
        run: php artisan serve --no-reload > /dev/null 2>&1 &

      - run: php artisan dusk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dusk-screenshots
          path: |
            tests/Browser/screenshots
            tests/Browser/console

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress
